; gammastep: warms the screen in the evening, easier on the eyes late at
; night. Fixed dawn and dusk times, so it needs no location service.
; $mod+Shift+b turns it off and on (i3/config). Reference: man gammastep.

[general]
temp-day=6500
temp-night=3800
fade=1
dawn-time=6:00-7:00
dusk-time=19:00-20:30
adjustment-method=randr
