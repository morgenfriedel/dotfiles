; polybar 3.7 — started by launch.sh, one bar per monitor.
; Docs: https://github.com/polybar/polybar/wiki
;
; Icons are Hack Nerd Font glyphs (see packages/manual.md). A glyph the font
; lacks is dropped with a warning on every redraw, so stick to Nerd Font
; codepoints rather than emoji.

[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
alert-bright = #CC6666
disabled = #707880

[bar/main]
; launch.sh sets MONITOR; empty means polybar picks the first one.
monitor = ${env:MONITOR:}
width = 100%
height = 24pt
radius = 6

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

; font-0: text. font-1: larger icons for workspaces (label-*-font = 2). It must
; be the Propo variant: Mono and plain Hack Nerd Font give every icon a
; one-cell advance, so wide icons like Firefox overlap their neighbour.
; The ";N" suffix is a vertical offset in pixels — raise it if glyphs sit high.
font-0 = Hack Nerd Font:size=10;2
font-1 = Hack Nerd Font Propo:size=13;3

modules-left = i3 xwindow
modules-right = filesystem pulseaudio memory cpu battery wlan date tray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; Secondary monitors get the same bar minus the tray: only one bar can own the
; X system tray.
[bar/secondary]
inherit = bar/main
modules-right = filesystem pulseaudio memory cpu battery wlan date

[module/tray]
type = internal/tray
tray-spacing = 6pt
tray-background = ${colors.background}

[module/i3]
type = internal/i3
; Show only this monitor's workspaces on each bar.
pin-workspaces = true
index-sort = true
enable-scroll = false

; Names are "N:<icons>", set by i3/scripts/workspace-icons.sh from the apps
; on each workspace. Stripping "N:" leaves just the icons; an empty workspace
; is plain "N" and keeps its number. Set this to false to show "N:" as well.
strip-wsnumbers = true

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.alert}

label-focused = %name%
label-focused-font = 2
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-foreground = ${colors.primary}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-font = 2
label-unfocused-padding = 2

; Focused on the other monitor.
label-visible = %name%
label-visible-font = 2
label-visible-underline = ${colors.disabled}
label-visible-padding = 2

label-urgent = %name%
label-urgent-font = 2
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:50:…%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
; Left click mutes and scroll changes volume (built in).
click-right = pavucontrol &

format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted =  muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 3
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 3
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

; Device names vary by machine (BAT0, BAT1, CMB0, ...); launch.sh detects them.
; Desktop notifications at low charge come from i3/scripts/battery-alert.sh.
[module/battery]
type = internal/battery
battery = ${env:POLYBAR_BATTERY:BAT0}
adapter = ${env:POLYBAR_ADAPTER:AC}
full-at = 99
low-at = 10
poll-interval = 5

format-charging = <label-charging>
format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.primary}
label-charging = %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%

format-full = <ramp-capacity> <label-full>
label-full = %percentage%%

; At or below low-at while discharging: red block with a blinking icon.
format-low = <animation-low> <label-low>
format-low-background = ${colors.alert}
format-low-foreground = #FFFFFF
format-low-padding = 1
label-low = %percentage%%
animation-low-0 = 
animation-low-1 = " "
animation-low-framerate = 600

; Below 20% the icon turns red, as an early warning before the low state.
ramp-capacity-0 = 
ramp-capacity-0-foreground = ${colors.alert-bright}
ramp-capacity-1 = 
ramp-capacity-1-foreground = ${colors.primary}
ramp-capacity-2 = 
ramp-capacity-2-foreground = ${colors.primary}
ramp-capacity-3 = 
ramp-capacity-3-foreground = ${colors.primary}
ramp-capacity-4 = 
ramp-capacity-4-foreground = ${colors.primary}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

; Click to toggle the full timestamp. Without seconds the bar only redraws
; once a minute.
date = %a %d %b %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
