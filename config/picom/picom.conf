# Backend
backend = "glx";

# VSync to reduce screen tearing
vsync = true;

# Enable shadows
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.6;
shadow-offset-x = -7;
shadow-offset-y = -7;

shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'polybar'",
    "_NET_WM_WINDOW_TYPE@:32a = '_NET_WM_WINDOW_TYPE_DOCK'",
    "class_g = 'st'"
];

# Fading for smooth transitions
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# Transparency settings
inactive-opacity = 0.85; # Make inactive windows slightly transparent
active-opacity = 1.0;    # Fully visible active windows
# frame-opacity = 0.8;
# corner-radius = 8;       # Rounded corners (if supported)

# Blur effects
blur:
{
    method = "none";
};

# blur-background = true;
# blur-background-frame = true;

# Exclude certain apps from transparency (like fullscreen windows)
opacity-rule = [
    "100:fullscreen = true",
    "100:_NET_WM_WINDOW_TYPE@:32a = '_NET_WM_WINDOW_TYPE_DOCK'",
    "100:_NET_WM_WINDOW_TYPE@:32a = '_NET_WM_WINDOW_TYPE_DESKTOP'",
    "100:class_g = 'firefox'",
    "100:class_g = 'mpv'",
    "90:class_g = 'st' && !focused"
];

# Animations (only in Picom-animations fork)
animation = {
    enabled = true;
    fade = true;
    fade-in-step = 0.05;
    fade-out-step = 0.05;
    fade-delta = 10;
    transition-length = 250;
    transition-pow-x = 2.5;
    transition-pow-y = 2.5;
    transition-pow-w = 2.5;
    transition-pow-h = 2.5;
};

# Prevent screen tearing
use-damage = true;
xrender-sync-fence = true;

